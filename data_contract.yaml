# Lorelei data contract — 実装より先にここが正。
# 変更したら名前で全台帳を grep する (CLAUDE.md 掟)。
# status: draft (spec 01 rev3 → spec 02 → spec 03 → spec 08 P0, 2026-09-28)

version: 0.1.0

AppIdentity:
  product_name: Lorelei
  identifier: jp.outcasts.lorelei   # app_data と WebView プロファイルの場所を決める。公開後は変更不可
  single_instance: true             # 2 つ目の起動は 1 つ目を前に出して終了する (同じ MCP のポートを取り合わない, spec 03 D5)

DiagramSource:
  description: Mermaid のテキスト 1 本。1 ソース = 1 図
  fields:
    text: { type: string, max_bytes: 262144 }   # 256 KiB。超えたら InputTooLarge で拒否 (上限値は P0 で見直す)
  notes:
    - "%%{init}%% ディレクティブは受け付ける (merman が解釈する範囲で)"

DiagramFamily:
  description: merman のパース結果で決まる図の種類 (先頭行の正規表現では判定しない)。値は merman の diagram_type をそのまま使う (例 flowchart-v2 / er / sequence)。一覧は merman の対応範囲に従い、ここでは列挙しない
  editable_in_gui: [flowchart-v2, flowchart, er]   # フォーク元エディタが扱える 2 種 (graph / flowchart はどちらも flowchart-v2)。他は描画・書き出しのみ

ValidationResult:
  fields:
    ok: bool
    family: { type: DiagramFamily, nullable: true }   # 判定できなかった時 null
    errors:
      type: list
      item:
        message: string
        line: { type: int, nullable: true }   # 行が分からない時は null。行を偽らない
    editor: EditorCompat

EditorCompat:
  description: GUI エディタで開いた時に何が落ちるか
  fields:
    editable: bool                  # family が editable_in_gui に入っているか
    dropped:                        # エディタが表現できず、開くと失われる構文
      type: list
      item:
        construct: string           # 例: subgraph / classDef / style / linkStyle / click / comment
        count: int
  notes:
    - "dropped = merman の意味モデルのうち、エディタのデータ形への変換器が写せなかった要素 (spec 01 D5')"
    - "MCP の戻り値と GUI の警告は同じ変換関数 (lorelei_core) の出力。フォーク元パーサーは通さない"

RenderFormat:
  enum: [svg, png, pdf]

RenderOptions:
  fields:
    scale: { type: float, default: 2.0, range: [0.5, 8.0] }    # png のみ有効
    background: { type: string, nullable: true, default: null } # null = Mermaid の既定 (白)。ただし効いているテーマ (theme か図の中のテーマ) が dark なら #333 (spec 24 D5)。CSS 色文字列か "transparent"。SVG ルートの background-color を書き換えるので 3 形式で同じ結果
    theme: { enum: [default, neutral, dark, forest], default: default }   # サイトの設定。図の先頭 (frontmatter・init) の theme が勝つ (spec 24 D7)

RenderResult:
  fields:
    format: RenderFormat
    family: DiagramFamily
    width: float
    height: float
    svg: { type: string, nullable: true }        # format=svg かつ output_path 未指定の時だけ本文を返す
    output_path: { type: string, nullable: true } # 書き出した時の絶対パス
    bytes: { type: int, nullable: true }

OutputPathPolicy:
  description: >-
    ファイルの書き出しの規則 (crates/lorelei_core/src/output.rs の write_file(path, extension, bytes, overwrite) と、それを RenderFormat の拡張子で呼ぶ write_output)。
    MCP の render と GUI の書き出し (GuiCommands.export_diagram) が使う。spec 24 までは「MCP 経由」だけの規則として書いていた (GUI の上書きの規則が書かれていなかった, spec 25 D2)
  common:   # 両方
    - 絶対パスのみ
    - 拡張子は書く種類と一致 (MCP の render は .svg / .png / .pdf、GUI の書き出しはそれに .mmd)。大文字小文字は問わない。不一致は拒否
    - 親ディレクトリは既存であること (勝手に作らない)
    - 書き込みは書き先と同じディレクトリの一時ファイル `.{name}.tmp.{uuid}` → rename (別ボリュームだと rename が失敗するため)
    - rename 失敗時は一時ファイルを消してエラー (途中で切れた壊れファイルを残さない)
  mcp_only:
    - 既存ファイルは overwrite=true の時だけ上書き
    - WSL のパス (/home/...) は Windows では絶対パスにならず拒否される。WSL 上のクライアントは非対応
  gui_only:
    - 保存先は OS の保存ダイアログ (rfd) で選ぶ。既存のファイルを選んだ時の上書きの確認は OS のダイアログが行い、確かめた後は上書きする (overwrite=true で呼ぶ)

EditorPayload:
  description: >-
    GUI へ渡す変換済みの図 (spec 01 D5')。data はフォーク元パーサーの出力と同じ形なので、
    フォーク元エディタの既存の取り込み処理 (flow-editor の handleImportMermaid / er-diagram-editor の
    handleImportMermaid) にそのまま渡せる
  fields:
    editor: { enum: [flowchart, erDiagram] }
    data: "flowchart なら ParsedMermaidData、erDiagram なら ParsedMermaidERData (下の mapping)"
    dropped: "EditorCompat.dropped"
  mapping:
    flowchart:
      output: "ParsedMermaidData { nodes: [{ id, variableName, label, shapeType }], edges: [{ id, source, target, label, arrowType }], direction?, subgraphs?: [{ id, title, nodes, parent?, direction? }], theme? }"
      theme: "図の先頭のテーマ (spec 24。MermaidTheme.import と同じ規則。Rust は merman の ParseMetadata.config を editor.rs の theme_of で読む)"
      subgraph: >-
        spec 15 D1 (TS の取り込み = P1、Rust の to_editor = P2。同じ規則で、FlowSubgraph { id, title, nodes, parent? })。枠が無ければ subgraphs を持たない。
        一覧の nodes には子の枠の ID も入るので、それを子の枠の parent にする (親は「自分の ID を nodes に持つ枠」)。subgraphs は親から順に並べ直す
        (mermaid.js・merman とも内側を先に返す。親が一覧に無い・輪になる枠は parent を外す)。nodes は直下のノードだけで、図のノードの順
        (mermaid.js は線の書き順の逆で返すことがある)。1 つのノードは 1 つの枠 (先に出た枠)。自分を nodes に持つ枠はその 1 件を無視。
        title は mermaid の内部の符号と実体参照を戻した文字、空白だけなら空。題の無い枠は title = id、題だけの枠 (subgraph 受付 審査) は id が subGraphN。
        枠と同じ ID のノードは作らない (線が枠を指すと mermaid は同じ ID のノードも作る)
      subgraph_direction_value: >-
        spec 16 D1。枠の direction? は SubgraphDirection = TB | BT | LR | RL (枠の中に書いた向き。書いていなければ持たない。Rust は FlowSubgraph.direction: Option<SubgraphDirection> の enum で、JSON は大文字の文字列)。図の向きの GraphType とは別の型
        (枠では「書いていない」と「TB と書いた」が Mermaid の描画で違う)。TD は TB にそろえる (裁定 3。mermaid.js も merman も TD を TD のまま持つが、
        そろえると入れ子の中の向きの無い枠の描画が両方の実装で一致する, P0)。小文字の direction lr は両方の実装で文法の誤りなので来ない。2 回書けば最後が勝つ
      editor_frame: >-
        エディタでは枠を xyflow の親ノード { type: subgraphNode, data: { variableName, title, direction? }, width?, height? } にし、中のノード・子の枠に parentId を付ける (親を前に並べる)。
        枠の向き (spec 16 D4・D6、裁定 1 の案 B。計算は features/flowchart/utils/frame-direction.ts): 取り込み時の配置と接続点は「書いた向き、無ければ置かれている側の向き」。
        ノード・枠の接続点は置かれている入れ物 (親の枠、無ければ図) の向き。枠にも入口と出口の接続点がある (pointer-events: all、見出し・つまみより後ろの DOM)。
        描画で効く向き (effectiveDirections。P0 で mermaid.js と merman の描画 520 点と一致した規則) がエディタの向きと違う枠は、見出しの下に理由を出す。
        線の操作では並べ直さない (接続点だけ動く)。見出しのメニューで枠の向きを変えた時だけ、その枠の中を取り込み時と同じ段組みで並べ直す (spec 16 P5、裁定 4。frame-edit.ts の relayoutFrame。枠の左上は保ち、大きさは中身に合わせ、はみ出したら外側の枠を広げる。図全体の向きの変更は並べ直さない)。知らせは中身が 2 つ以上の枠だけ (1 つならどの向きでも同じ)、見出しの下に 1 行 (全文は title)。
        GUI の編集 (spec 16 D7、P3): 見出しの向きのメニュー (指定なし・TB・LR・RL・BT。項目のリストは Portal で文書の直下) /
        枠と自分の子孫を結ぶ線は isValidConnection で繋がせない (frame-edit.ts の intoOwnFrame)。接続点・ノードの上で離して断られた時は新しいノードを作らない (onConnectEnd の connectionState.toHandle / toNode) /
        ドラッグの付け替えで新たにそうなる線 (edgesBrokenByDrop) は確認してから消し、やめたらドラッグの前の位置へ戻す /
        枠を消す確認に枠につながる線の本数 / 枠の自己ループは枠の外を回す (frameSelfLoopPath: 出口と入口が上下なら右、左右なら下)
        枠をまたぐ線・ノードを貫く線 (spec 17、裁定 1〜3。spec 19 で回す対象を改めた。計算は features/flowchart/utils/edge-route.ts の routeEdges、配るのは hooks/use-edge-routes.ts): 表示だけで、保存・コード生成・read_diagram には何も足さない。
        回すのは次のどれかに当たる線 (spec 19 裁定 1 の案 A・裁定 2 の案 C): 今の曲線 (getBezierPath) か、回さない時のボタン (曲線の中点 + adjustEdgeLabelPosition のずれ) が、どちらの端も中にいない枠・端である枠の内側と交わる /
        今の曲線がノード (高さを問わない。枠の無い図の戻る線・段を飛ばす線も) を貫く / ボタンがノードに縦横とも 12 以上かかる (かすりでは回さない)。端そのものと端の祖先の枠は判定に入れない。
        回した道は縦と横の線分 (道のり + 曲がり 40 の A*。障害物と端そのものを 12 離し、通れる枠 (端の祖先) は見出しの帯だけ避ける。角は 8 で丸める)。
        回した線どうしが同じ線分に重なる時だけ 8 ずつ離す (避けるものから 6・通れる枠の縁から 12 を空ける向きだけ)。内外の判定は縁から 1e-6 より内側だけ (failures #31)。
        ボタンは一番長い線分の中点から、障害物・回した線のボタン・回さない線のボタン (spec 21 で滑らせた後の位置) と自己ループのボタンに重ならない所。線分の上に置けなければ、線がボタンの中を通る範囲で線分と直交する向きに 2 刻みでずらす (spec 19 P1)。
        回さない線のボタン (spec 21): 線の並びの順に 1 本ずつ確定させ、前の線の確定した位置か自己ループのボタンと重なる線だけを、自分の曲線の上で中点に近い順 (道のり 8 刻み、同じ近さは出口の側が先) に、
        ほかの全部のボタン (前の線は確定した位置、後ろの線は今の位置) と 4 空け (ROUTE.LABEL_GAP)、全部のノード (端を含む)・枠の見出しの帯と重ならない所へ滑らせる。置けなければ直交する向きに 2 刻み、それでも無ければ今の位置。
        自己ループのボタンは動かさない。routeEdges は滑らせた線を折れ線が空 (points: []) の EdgeRoute で返し、線の部品は曲線のまま返された位置に置く (adjustEdgeLabelPosition を重ねない)。
        ドラッグ中は動いたものと関わる線だけ探し直す (回さない線のボタンは毎回全部を置き直す)。回さない線のボタンのずれは線の一覧が同じ間は使い回す。
        手を離したら (ノードの dragging が true → false) 形が同じでも全部を探し直す。手を離した時に xyflow が積む dragging: false を消さないよう、
        onNodeDragStop の付け替えは setNodes に関数で渡す (spec 22、failures #38)。探索 (search) の出す道は spec 22 で速くする前と同じ (前の実装の写しと golden で確かめる)
        GUI の編集 (spec 15 D5、P3。計算は features/flowchart/utils/frame-edit.ts):
        「枠を追加」= 画面の中央に 320×200、ID は使っていない最小の group{N}、題 グループ{N}、配列の先頭 /
        ドラッグを終えたら中心を含む一番内側の枠へ付け替え (自分と子孫の枠は除く。一緒にドラッグした祖先があるものは付け替えない)、枠の外なら図の直下、はみ出しただけなら枠を広げる (左・上は枠を動かし中身の絶対位置を保つ。親の枠へ繰り返す) /
        題・ID は見出しのダブルクリック (ほかのノード・枠とぶつかる ID と空は確定させない) / 大きさは右・下・右下のつまみ (中身より小さくできない) /
        消す時は onBeforeDelete で、xyflow が足した「選んでいない子」を消す一覧から外し、消す枠の親 (無ければ図の直下) へ先に付け替える (子の枠は中身ごと 1 段上)。確認に残る数を出す。
        メニュー・× の名指しの削除では子の選択を見ない (failures #24) /
        枠のノードは style: FRAME_NODE_STYLE (pointer-events: none)。見出し・つまみ・× だけが押す操作を受け、枠の本体の下の線・線のボタン・空いている所に届く。枠のある図では線のラベルを一番上の枠の高さ + 1 に描く (failures #25)
      direction: "GraphType = TD | LR | RL | BT。無ければ TD (spec 07 D1)。merman の TB は TD にそろえる (同じ意味)。graph と flowchart は区別しない (生成器はいつも flowchart と書く)"
      node: "id = variableName = merman の id。label はそのまま (markdown の記法も文字列のまま)。TS の取り込み (spec 11) は mermaid の内部の符号と HTML の実体参照を戻した文字、空白だけなら空"
      edge_id: "{source}-{target}。使った ID の集合を持ち、ぶつかれば空くまで -2, -3 … を付ける (spec 11 で直した。以前は同じ組の数だけで、- を含む ID で a-b --> c と a --> b-c がぶつかった)"
      shape:   # merman の shape → エディタの shapeType。表に無い形は rectangle にして dropped "shape:<名前>"
        square: rectangle
        round: rounded
        diamond: diamond
        circle: circle
        hexagon: hexagon
        stadium: stadium
      arrow:   # (merman の type, stroke) → arrowType。表に無い組は近いものにして dropped "edge:<元の矢印>"
        "arrow_point, normal": arrow
        "arrow_point, thick": thick
        "arrow_point, dotted": dotted
        "arrow_open, invisible": invisible
        "double_arrow_point, normal": bidirectional
        "double_arrow_point, thick": bidirectional-thick
      arrow_fallback: "stroke が invisible → invisible / double_* → bidirectional (thick なら -thick) / それ以外 → stroke に応じて arrow・thick・dotted"
      edge_to_subgraph: "枠を指す線は、線の端を枠の ID にして写す (spec 16 D2。外 → 枠・枠 → 外・枠 → 枠・枠の自己ループ。線が枠の定義より前にあっても同じ)。生成器も線を全部最後に外へ書く"
      edge_into_own_subgraph: "枠と自分の子孫 (中のノード・中の枠) を結ぶ線は落として dropped edge_into_own_subgraph (spec 16 裁定 2。mermaid.js・merman とも誤りにしないが、描画では長さ 0 の線で見えず、枠を外とつながる扱いにして中の向きを変える, P0)。生成器も書かない。枠の自己ループは当たらない"
      subgraph_direction: "枠の中の direction を枠の direction? に写す (spec 16。subgraph_direction_value)"
      dropped_constructs: [edge_into_own_subgraph, classDef, class, style, click, tooltip, "shape:<名前>", "edge:<矢印>", edge_length, accessibility, "config:<名前>", "theme:<名前>"]   # direction は spec 07、subgraph は spec 15、枠を指す線と枠の中の向きは spec 16 で写すようにした (TS の取り込みは P1、Rust の to_editor は P2)
    erDiagram:
      output: "ParsedMermaidERData { nodes: [{ id, name, columns: [{ name, type, pk, uk, fk? }] }], edges: [{ id: edge-N, type: erEdge, source, target, data: { label, cardinality } }], direction?, theme? }"
      theme: "flowchart と同じ (spec 24)"
      direction: "flowchart と同じ GraphType。無ければ TD (spec 07 D1)"
      keys: "merman の attribute.keys (PK / UK / FK の配列、順は問わない) → pk / uk / fk。fk は無ければ false (spec 07 D2。古い保存データ・フォーク元の既存データを壊さない)"
      entity: "id = name = merman の entities のキー (alias は使わない) を、mermaid の内部の符号と HTML の実体参照を戻した文字 (spec 13 P3。Rust は merman::entities::decode_mermaid_entities_to_unicode、TS は写しの decodeText。関係の両端も同じ名前)"
      label: "roleA を、内部の符号と実体参照を戻した文字 (spec 13 P3。以前の Rust はそのままで #quot; が符号になった, failures #19)。空なら空 (フォーク元の生成器が出力時に relation で補う)"
      cardinality:   # merman の (cardB = 左側の記号, cardA = 右側の記号)。2026-09-24 実測で確認
        "ONLY_ONE, ONLY_ONE": one-to-one               # ||--||
        "ONLY_ONE, ZERO_OR_MORE": one-to-many          # ||--o{
        "ZERO_OR_MORE, ONLY_ONE": many-to-one          # }o--||
        "ZERO_OR_MORE, ZERO_OR_MORE": many-to-many     # }o--o{
        "ZERO_OR_ONE, ONLY_ONE": zero-to-one           # o|--||
        "ONLY_ONE, ZERO_OR_ONE": one-to-zero           # ||--o|
        "ONLY_ONE, ONE_OR_MORE": one-to-many-mandatory # ||--|{
      cardinality_fallback: "表に無い組はフォーク元の既定 one-to-many にして dropped cardinality_unsupported"
      subgraph: "関係が subgraph を指すと、関係はその subgraph の id を指し、同じ名前のテーブルも現れうる。テーブルにせず、指す関係を落として dropped subgraph / edge_to_subgraph (spec 11。以前は形の誤りで止まった)"
      edge_id: "edge-N。N は落とした関係を除いて数える"
      dropped_constructs: [alias, attribute_comment, non_identifying, cardinality_unsupported, subgraph, edge_to_subgraph, classDef, class, style, accessibility, "config:<名前>", "theme:<名前>"]   # fk と direction は spec 07 で写すようにした
    ts_mirror: "フォーク元の取り込み (spec 11) は同じ対応を TS で持つ: features/flowchart/utils/from-mermaid.ts・features/er-diagram/utils/from-mermaid.ts (mermaid.js の解析の結果から)。tests で Rust の tests/editor.rs と同じ入力で同じ出力を確かめる。TS だけの足し: click は class の clickable でも数える (strict では haveCallback が付かない) / @{ shape: rect | rounded | diam | hex } もエディタの形"

EditorDirection:
  description: エディタの図の向き (spec 07 D1)。フォーク元の GraphType。エディタの状態がただ 1 つの持ち主で、ツールバー・パネル・コード生成のモーダルはそれを読み書きする
  values: [TD, LR, RL, BT]
  default: TD
  generate:
    flowchart: "generateMermaidCode(flowData, direction, theme?) → 1 行目 flowchart {direction} (テーマが default 以外なら、その前に MermaidTheme.frontmatter)"
    erDiagram: "generateERDiagramMermaidCode(nodes, edges, direction = TD, theme?) → TD なら direction の行を書かない (今の出力のまま)。LR / RL / BT なら erDiagram の次の行に direction {dir}。テーマは flowchart と同じ"
  keys_order: "ER 図のキーは PK → UK → FK の順でカンマ区切り (例 PK, FK)。読む時は順を問わない"
  layout_on_import: "軸 = LR / RL なら横、TD / BT なら縦。逆向き = BT / RL なら階層の順を反対に。取り込みの時だけ並べる (向きを変えても並べ直さない)"
  handles: { TD: [target Top, source Bottom], BT: [target Bottom, source Top], LR: [target Left, source Right], RL: [target Right, source Left] }

MermaidTheme:
  description: 出力のテーマ (spec 24)。図の Mermaid の先頭に書いて持ち回る (D1)。編集画面 (キャンバス) の見た目には使わず、コード生成・プレビュー・書き出しにだけ効く。フォーク元の改善 (Web 版でも動く)
  values: [default, neutral, dark, forest]   # D3。base・neo などは選べない (取り込みでは dropped theme:<名前>)
  default: default
  owner: "エディタの状態 (フローチャート・ER 図とも向きと同じ持ち方)。取り込みで受け取り、コード生成のダイアログの ThemeMenu (features/flowchart/components/theme-menu.tsx) で読み書きする"
  module: "components/ui/mermaid-theme.ts (MERMAID_THEMES・isMermaidTheme・themeFrontmatter・themeBackground・themeFromConfig)"
  frontmatter: "図の先頭に「---」「config:」「  theme: <テーマ>」「---」の 4 行を書く (D2)。default は何も書かない (今までの出力とバイト単位で同じ)"
  import: "frontmatter か init がある図だけ、mermaid.parse が返す図の設定 (プレビューの render と同じ前処理) を MermaidSnapshot.config { theme?, keys } に写し、読んだ後は mermaidAPI.reset() で initialize の値へ戻す。theme が values に入っていれば ParsedMermaidData / ParsedMermaidERData の theme (default は持たない)。テーマ以外の設定は dropped config:<名前>、選べないテーマは dropped theme:<名前>。文字でない theme は黙って無視。frontmatter と init の両方があれば init が勝つ。frontmatter の title は設定ではない"
  import_rust: >-
    デスクトップ・MCP の取り込み (lorelei_core::to_editor、spec 24 P2) は merman の ParseMetadata.config (mermaid.parse の config と同じ形) を editor.rs の theme_of で読み、TS と同じ theme と dropped にする。
    merman の config には mermaid.js が図の設定から消す鍵 (mermaid の既定の secure: secure・securityLevel・startOnLoad・maxTextSize・suppressErrorRendering・maxEdges) も残るので、それは数えない。
    fontFamily は両方とも themeVariables.fontFamily にも写す (config:fontFamily と config:themeVariables の 2 つ)。取り込みの守りで読むので、themeVariables の色が読めない図でも取り込める (TS は mermaid.parse がその図の設定ごと失敗し、theme も dropped も持たない — 描けない図なので揃えない)
  background: "themeBackground: dark は #333 (Mermaid の dark の background)、ほかは white (D5)。コード生成のダイアログはプレビューの枠 (MermaidTwoPane の previewBg) をこれにする。書き出しの背景は RenderOptions.background (同じ規則を Rust の render_svg が効いているテーマで決める)"
  desktop: "デスクトップの自動保存 (toSource) はエディタのテーマを DesktopActions.theme で受け取り、生成器に渡す (spec 24 P2。P1 の時点では開いた直後の自動保存でテーマが消えた)。書き出し (export_diagram) はダイアログのコードの先頭のテーマで描くので引数は無い"
  fixture: "crates/lorelei_core/tests/fixtures/themes.json = [{ name, kind, source, theme, dropped }]。__tests__/lorelei/themes-fixture.test.ts が生成器の出力 (4 つのテーマ × 2 種類) と AI が書きうる形 (init・両方・base と themeVariables・選べないテーマ・文字でない theme・wrap・init の config・守られる鍵) を本物の mermaid.js の取り込みに通して期待どおりかを検めて書き (LORELEI_UPDATE_FIXTURES=1)、editor.rs の theme_import_matches_the_ts_import が to_editor で同じ theme と dropped になることを確かめる"

DesktopActions:
  description: エディタのパネルが外枠 (lib/desktop) に登録する操作 (spec 02 D3、useDesktopActions)。外枠はこれでツールバーを動かす
  fields:
    add: "{ label, run }。ノード追加 / テーブル追加"
    code: "() => void。コード生成のモーダルを開く"
    direction: "EditorDirection。今のエディタの向き (spec 07 D3)。外枠はツールバーの切り替えに出し、保存 (toSource) に使う"
    setDirection: "(EditorDirection) => void。ツールバーの切り替えから向きを変える (spec 07 D3)"
    theme: "MermaidTheme (任意、無ければ default)。今のエディタのテーマ (spec 24 P2)。外枠は保存 (toSource) にだけ使う。選ぶのはコード生成のダイアログで、ツールバーには出さない"
    addFrame: "() => void (任意)。フローチャートのパネルだけが登録し、登録した時だけツールバーに「枠を追加」を出す (spec 15 D5)"
    history: >-
      { undo, redo, canUndo, canRedo } (任意、spec 30 P2)。外枠はツールバーに ↶ ↷ を出す。undo / redo は登録に載せ、canUndo / canRedo は登録とは別の通り道
      (DesktopActionsProvider の onHistoryStatus) で知らせる (登録し直すと editorMounted が走るので、手を打つたびに登録し直さない)
  importMermaid: >-
    (data, adjust?) => void (任意、spec 32 D4)。エディタの取り込み (handleImportMermaid)。adjust は取り込んだノードを当てる前にかける関数 (フォーク元の省略できる引数)。
    「確定へ戻す」は確定した中身を convert_source で変換し、図が替わっていなければ adjust = withLayout(確定した位置) で 1 回の setNodes で当てる (開く経路を使わないので Undo の 1 手になる)
  autosave: "外枠は向き・テーマの変化でも自動保存する (ノード・辺が変わらなくても。spec 07 D3・spec 24 P2)"

DesktopMmdDownload:
  description: >-
    コード生成のダイアログの「ダウンロード」(.mmd) の口 (spec 25 D4)。lib/desktop/mmd-download.ts の useMmdDownload、lib/desktop/index.ts から export する。
    フォーク元の 2 つのダイアログ (features/flowchart/components/mermaid/download-modal.tsx・features/er-diagram/components/panel/er-diagram-mermaid-modal.tsx) の「ダウンロード」の onClick が呼ぶ
  signature: "useMmdDownload(fileStem: string, webDownload: () => void) → { download: (code: string) => void, busy: boolean }"
  fields:
    fileStem: "保存ダイアログの既定の名前 (拡張子なし)。flowchart / er-diagram (spec 25 D3。今の Blob のファイル名と同じ)"
    webDownload: "Web の落とし方 = フォーク元の今の Blob + <a download> の処理 (download-modal.tsx の downloadMermaidCode / ER 図のダイアログの props の onDownload)。デスクトップでは呼ばない"
    download: "押した時に isTauri() を見る。偽 (Web 版) なら webDownload() だけ。真 (デスクトップ) なら webDownload は呼ばず、DesktopSaveDialog が出している間は何もせず、そうでなければ exportDiagram(code, \"mmd\", fileStem)"
    busy: "DesktopSaveDialog が出している間 true (どのボタンから出したものでも)。フォーク元のボタンには渡さない (見た目は変えない)"
  notice: "フックが出す (ExportButtons と同じ文言): 保存したら success「保存しました」+ パス / 取り消し (null) は何も出さない / 失敗は error「保存できませんでした」+ 誤りの文 (duration null = 閉じるまで残る)"
  web: "Web 版 (GitHub Pages) は今のまま。ブラウザがダウンロードを扱う"

DesktopSaveDialog:
  description: >-
    保存ダイアログは窓に 1 つだけ (spec 25 D5)。lib/desktop/save-dialog.ts がモジュールの状態に「出している」を 1 つ持ち、useSyncExternalStore で購読させる。
    書き出しのボタン (ExportButtons) と DesktopMmdDownload の両方が runSaveDialog を通して exportDiagram を呼ぶ
  run: "runSaveDialog(task: () => Promise<T>) → Promise<{ ran: true, value: T } | { ran: false }>。出している間 (押してから、取り消すか保存し終えるか失敗するまで) は task を呼ばずに { ran: false }。task が投げたら状態を戻してから投げ直す"
  subscribe: "useSaveDialogBusy() → boolean"
  buttons: "ExportButtons の 3 つは、どれから出した保存ダイアログでも押せない (disabled)。押した形式の loading は今のまま。ダウンロードのボタンは見た目を変えず、押しても何もしない"
  why: "保存ダイアログは窓を親にしたモーダル (rfd の set_parent) なので、出た後は OS が窓を止める。止めるのは、押してから出るまでの間 (spawn_blocking) と、別のボタンからの同時押し"

MermaidPreview:
  description: コード生成のモーダルの右の列で、生成した Mermaid を mermaid.js で描く (spec 09 D3)。フォーク元の改善 (Web 版でも動く、Tauri に依らない)
  library: "npm mermaid 11.17.2 (版を固定。書き出しの merman が追従する版と同じ。12 は merman が追従してから, spec 09 D1)"
  boundary: "components/ui/mermaid-render.ts の renderMermaid(id, code) → Promise<string (SVG)> だけが mermaid に触る。最初に描く時に動的 import し、initialize は 1 回"
  initialize: { startOnLoad: false, securityLevel: strict, theme: default, suppressErrorRendering: true }   # htmlLabels は既定 (true) のまま (裁定 2026-09-28)。書き出しの RenderConfigOverrides とは違う
  render_id: "mermaid-preview-<連番>。描くたびに新しくする (mermaid は同じ id の要素を最初に消す)"
  states: [loading, done, error]   # error は mermaid の例外の文をそのまま出す
  keep_last: "keepLast (spec 10 D6、インポートだけ): 描いている間・描けない時も最後に描けた図を残し、誤りは図の上に帯で重ねる"
  default_header: "defaultHeader (spec 11 D2): 図の種類が無いと mermaid が言った時だけ補って描く (フォーク元のインポートで flowchart TD)"
  theme: "コードの先頭のテーマ (frontmatter・init) は mermaid.js の render が毎回当て直すので、テーマはコードだけで効く。プレビューの枠の背景は MermaidTheme.background (コード生成のダイアログだけ。インポートのダイアログは白のまま, spec 24)"

MermaidImport:
  description: インポートの取り込み (spec 11)。Web 版はフォーク元のダイアログが mermaid.js の解析から、デスクトップはツールバーのダイアログが Rust (import_source → to_editor) で取り込む。どちらも本文は同じ (MermaidEditorWithPreview)
  boundary: "components/ui/mermaid-render.ts の readMermaidDiagram(code, { defaultHeader? }) → MermaidSnapshot (components/ui/mermaid-snapshot.ts の素のデータ)。文法の誤りは MermaidSyntaxError (issue: ParseIssue、模擬しない mermaid-parse-issue.ts に置く)。描画・検査・読み取りは 1 本の列、直前の本文の読み取りの結果を 1 件覚えて赤線と要約で使い回す"
  readers:
    flowchart: "features/flowchart/utils/import-flowchart.ts の readFlowchartForImport(code) → { ok, data: ParsedMermaidData, dropped } | { ok: false, error }。見出しの無いコードは flowchart TD を補う"
    er: "features/er-diagram/utils/import-er.ts の readErForImport(code)"
  errors: "文法の誤り = 「Mermaid の文法の誤りで取り込めません（N 行目）: <誤りの文の 1 行目>」/ 図の種類の違い = 「フローチャートではありません…」「ER 図ではありません…」。1 行でも誤りがあれば全体を取り込まない (フォーク元の正規表現のパーサーは読めない行を飛ばしていた)"
  warnings:
    summary: "取り込むと消えるもの: <describeDropped>。取り込みと同じ計算 (from-mermaid の dropped)。400ms 止まったら作り直す"
    lines: "features/*/utils/drop-warnings.ts の字句の目安 → CodeEditor の warnings (黄色)。デスクトップは 1 行目の図の種類で規則を選ぶ。フローチャートの subgraph / end の行には付けず (spec 15 で取り込む)、subgraph <ID> の ID を線の両端に持つ行と、枠の中の direction の行に付ける (D6)"
    labels: "components/ui/mermaid-dropped.ts の describeDropped / DroppedItem。lib/desktop/open-requests.ts (MCP の通知) はこれを再エクスポートする。config:<名前> は「設定 <名前>」、theme:<名前> は「テーマ <名前>（選べないテーマ）」(spec 24 D4)"
  config: "図の先頭の frontmatter・init は MermaidTheme.import で読む (spec 24。前は黙って消えた)"
  generator: "ノードのラベルは ( ) [ ] { } | \" か #語; か direction + 空白 + 大文字の向き (TB / TD / BT / RL / LR) を含む時だけ \"…\" で囲み、中の \" は #quot;、#語; の # は #35;、その direction の後ろの空白 → #<符号位置>; (spec 15 D8。mermaid.js は囲みの中でも行のどこでもこの並びを向きの指定として取り、その行のノードと線が黙って消える。小文字の direction + 大文字の向きだけが当たる)。線のラベルも同じ並びを含む時は囲む。空のラベルは [\" \"]。< > はそのまま (mermaid はラベルを HTML として扱う)。フローチャートの枠 (spec 15 D2): subgraph <getSafeVariableName した ID>[\"<題>\"] … end で囲み、中身を 4 字ずつ下げる。題はいつも囲み (ID と同じでも)、囲み方はラベルと同じ、空の題は \" \"。線は全部、枠の外 (最後) に書く (ブロックの中の線は外のノードを枠へ引き込む)。枠を指す線は書かない。親子が輪になった枠は図の直下に書く。枠の無い図の出力は今までと一字一句同じ。ER 図 (spec 13 D1・D2): テーブル名・関係の両端・関係のラベルは quoteErName — ^[\\p{L}_][\\p{L}\\p{N}_-]*$ に合い、erdiagram / style / classdef / class / subgraph / end / direction / acctitle / accdescr / many / one / to で始まらず (大文字小文字を問わない前方一致)、u- / u. で始まらない時だけそのまま、ほかは \"…\" で囲む。囲んだ中は #語; の # → #35;、& → #38;、\" → #quot;、% → #37;、バックスラッシュ → #92;、direction + 空白 + 向き の空白 → #<符号位置>; の順。列は columnIssue が null の時だけ書く (名前・型とも mermaid.js の列の規則の形、PK / FK / UK で始まらない。型は ~ 2 つの総称型も可)。全部の列を書かない時は 名前 { } のまま"
  differs_from_export: "書き出し (SVG / PNG / PDF) は merman。描き手・書体・ラベルの描き方が違うので一致しない (LORELEI.md 既知の制約)"
  generator_fixture: "crates/lorelei_core/tests/fixtures/er_names.json = [{ name, source }]。source は TS の ER 図の生成器の出力 (テーブル name と B、B → name の関係のラベルも name。名前の格子 50 通り)。__tests__/lorelei/er-names-fixture.test.ts が今の生成器と一字一句同じことを確かめ (LORELEI_UPDATE_FIXTURES=1 で書き直す)、Rust の editor.rs の er_generator_names_round_trip_through_merman が to_editor に通して名前・ラベルが戻ることを確かめる (spec 13 P3)。
    フローチャートの枠 (spec 15 P2、spec 16 P2): crates/lorelei_core/tests/fixtures/flow_subgraphs.json = [{ name, source, nodes, subgraphs, edges? }]。source は TS の生成器の枠の出力 (入れ子・空の枠・安全な ID・題の格子 22 通り・枠の向き 4 通り・枠を指す線と自己ループ)、edges? は戻るべき線の端 (spec 16 の場面だけ)、
    nodes・subgraphs は戻るべき形。__tests__/lorelei/flow-subgraphs-fixture.test.ts が書き (LORELEI_UPDATE_FIXTURES=1)、editor.rs の flow_generator_frames_round_trip_through_merman が merman で同じ形に戻ることを確かめる
    (mermaid.js で同じ期待値に戻ることは round-trip-mermaid.test.ts の「枠」)"

ErUnwritableColumns:
  description: ER 図のエディタで Mermaid に書けない列を知らせる (spec 13 D2)。生成器はその列を書かない (MermaidImport.generator)。フォーク元の改善 (Web 版でも同じ。デスクトップのツールバーの「コード生成」も同じダイアログを開く)
  field_problem: "features/er-diagram/utils/er-names.ts の fieldProblem(value, name | type) → empty | space | key | chars | null。columnIssue はこれで組む"
  reason: "describeFieldProblem → 「名前が空」「名前に空白」「名前が PK・FK・UK と読まれる」「名前に書けない文字」(型も同じ形)。名前も型も空は「名前と型が空」"
  cell: "列の入力欄 (CellEditor) は確定した値で判定し、書けないセルを invalid (赤枠)・aria-invalid・title「<理由>（Mermaid に書けないので、この列はコードに書き出しません）」にする。名前も型も空の列 (カラム追加の直後) には出さない。値は消さない"
  dialog: "SkippedColumn { table, column, reason }。unwritableColumns(tables) をパネルが今のテーブルから作り、ERDiagramMermaidModal の skippedColumns に渡す → 見出しの下に「書き出していない列: <table>.<column>（<reason>）、…」。無ければ出さない"
  table_name: "テーブル名の入力欄も CellEditor (rejectBlank)。Enter・フォーカスが外れた時に反映し、空・空白だけで確定したら確定前の名前に戻す (spec 13 D3)"

CodeEditor:
  description: Mermaid を書く・読むエディタ (spec 10)。CodeMirror 6 の薄い包みで、Kataribe の CodeEditor.vue を React に写した。フォーク元の改善 (Web 版でも動く)
  files:
    component: "components/ui/code-editor.tsx (CodeMirror を import する。ダイアログからは直接読まない)"
    lazy: "components/ui/lazy-code-editor.tsx の LazyCodeEditor (next/dynamic、ssr: false)。ダイアログが読むのはこれだけ = CodeMirror はエディタを描く時に初めて読む"
  props: { value: string, onChange: "利用者の打鍵の時だけ (value を外から変えた時は出さない)", readOnly: bool, placeholder: string, height: "CSS 値、既定 100%", mermaid: "flowchart | er (補完の 1 行目を絞る。両方を受けるデスクトップのインポートでは付けない)", intellisense: "補完と文法の赤線 (インポートだけ)", status: "フッタ (行・列・行数・文字数・挿入/上書き)", warnings: "(text) => { line, message }[]。取り込むと消える行の黄色の印 (spec 11 D4)", defaultHeader: "見出しの補い。赤線の検めにも通す (spec 11 D2)" }
  used_by:
    import: "インポートのダイアログ (Web 版はフォーク元のフローチャート・ER 図、デスクトップはツールバーの 1 つ。spec 11 D7): 編集・intellisense・status。右に MermaidPreview (400ms 止まったら描く、keepLast)。本文がある時は Esc で閉じない"
    code_generation: "コード生成のダイアログ: readOnly (行番号・検索だけ)"
  language: "components/ui/mermaid-language.ts の StreamLanguage (flowchart / graph / erDiagram)。closeBrackets は ( [ \" だけ ({ は ER の多重度を壊すので閉じない)。コメントは %%"
  completion: "components/ui/mermaid-completion.ts の mermaidCandidates(text, pos, kind) → { options, from, typed, validFor, auto }。置換範囲と validFor は同じ [\\p{L}\\p{N}_] (IME の確定で二重に挿さらない)。多重度はエディタが扱える 7 組 (erDiagram の cardinality)"
  lint: "mermaid-render.ts の parseMermaid(code) → ParseIssue | null { line (1 始まり, 本文の行), fromColumn, toColumn, message }。mermaid が注釈と先頭の空行を消して数える行を prepareForParse / toParseIssue で本文の行に直す。500ms 遅延"
  escape: "CodeMirror が使った Esc (補完・検索を閉じる) は包みで伝播を止める (Yamada のダイアログは defaultPrevented を見ずに閉じるため)"
  phrases: "components/ui/editor-phrases.ts の EDITOR_PHRASE_KEYS (ライブラリのキー → 訳のキー、spec 31 で EDITOR_PHRASES_JA から改めた) と editorPhrases(lng?)。search・lint・autocomplete・view・commands・language が phrase() で引く文言を画面の言語で。Compartment で差し替える。テストが 6 つの dist からキーを抜いて照合し、どの言語の訳も $ を残す"

EditorMinimap:
  description: キャンバスの右下のミニマップの出し入れ (spec 26 D4〜D6)。フォーク元の改善 (Web 版でも動く。キーに Lorelei の名を入れない)
  files:
    layout: "components/layout/flow-layout.tsx の FlowLayout。2 つのエディタ (flow-editor・er-diagram-editor) が共通に使う"
    hook: "components/layout/use-minimap-visible.ts の useMinimapVisible() → [shown, toggle]"
  control: >-
    左下の xyflow の Controls に ControlButton を 1 つ (lucide-react の Map。Controls の svg は fill: currentColor なので、線で描くアイコンは塗りを消す)。
    aria-label「ミニマップ」・aria-pressed = 出しているか・title「ミニマップを隠す」/「ミニマップを出す」
  storage: "localStorage、キー mermaid-editor.minimap.v1、値 shown | hidden。2 つのエディタで共通。デスクトップの dev と配布版は起点が違うので別々に覚える (DesktopLayout と同じ)"
  default: shown   # 今と同じ見た目で始まる
  read: "マウントの後に読む (静的書き出しでサーバー側でも描かれるので、最初の描画は既定値 = HTML と食い違わない)"
  on_read_error: "読めない・知らない値 → shown。localStorage に触れると投げる環境でも止めない。書けなくても切り替えは効く"

UiColorMode:
  description: >-
    画面 (外枠・エディタ・ダイアログ) の色モード (spec 27)。図の出力の色 (MermaidTheme) とは別 — 画面を dark にしても書き出しとコード生成は変わらない
  values: [light, dark, system]   # system は OS の色に追従する (yamada-ui が prefers-color-scheme を見る)
  default: light   # 今と同じ見た目で始まる
  storage: "yamada-ui の既定の色モードの記憶 (localStorage、キー ui-color-mode)。body に ui-dark / ui-light、html に data-mode と color-scheme"
  control:
    desktop: >-
      タイトルバーの「?」の左のボタン (lib/desktop/color-mode-menu.tsx の ColorModeMenu)。アイコンは選んでいる色 (ライト = 太陽・ダーク = 月・OS に合わせる = 画面)、
      aria-label「画面の色: <選んでいる色>」。押すとメニュー「ライト」「ダーク」「OS に合わせる」(選んでいる項目は色の名 selected の地)。
      選ぶと yamada-ui の changeColorMode (localStorage の ui-color-mode に覚える)
    web: "出さない (Web 版は light のまま, D3 案 A)"
  window_show: "デスクトップの窓は隠したまま起動し、外枠が描けたら出す (spec 05 D5)。出す時には body の色モードの class が付いている (D7)"
  canvas: "2 つの <ReactFlow> に yamada-ui の解決した色モード (light | dark) を colorMode で渡す (D5)"
  unchanged: "CodeMirror のエディタ (今も暗い)・Mermaid のプレビューの中 (図のテーマの色)・書き出しとコード生成の出力 (D6)"

UiLocale:
  description: >-
    画面の言葉の言語 (spec 31)。フォーク元の改善 (Web 版でも動く。キーに Lorelei の名を入れない)。図の中身 (Mermaid) の言葉とは別 — 切り替えても図は変わらない
  values: [ja, en]   # spec 35 で zh-Hans・ko を足す (訳が揃った時に一覧へ)。一覧は components/i18n/i18n.ts の LOCALES (名はその言語で書く)
  build_locale: ja   # 静的書き出しの HTML とブラウザの最初の描画の言語 (D5)。描画の中で navigator・localStorage に触らない
  fallback: en       # 一覧に合う言語が無い時・訳の無いキー
  storage: "localStorage、キー mermaid-editor.locale.v1、値 = values のどれか。利用者が選んだ時だけ書く。読めない・知らない値は覚えていない扱い"
  detect: >-
    マウントの後に (D5): 覚えた言語 → navigator.languages を上から見て近いもの (ja* → ja、en* → en、zh・zh-CN・zh-SG・zh-Hans* → zh-Hans (一覧にある時)、
    zh-TW・zh-HK・zh-MO・zh-Hant* は簡体字に寄せない、ko* → ko (一覧にある時)) → 英語。決まったら i18n.changeLanguage
  html_lang: "<html lang> は組み立ての時は ja のまま。言語が決まる・切り替わるたびに document.documentElement.lang を書く"
  control:
    web: >-
      2 つのパネルの見出しの NavigationMenu の右に components/i18n/language-menu.tsx の LanguageMenu (D9)。地球のアイコン (LanguagesIcon)、aria-label「画面の言語: <今の言語の名>」、
      title「画面の言語」。項目は LOCALES の名 (その言語で書く、lang 付き)、今の言語は色の名 selected の地。選ぶと setLocale (すぐ切り替わり、覚える)。デスクトップでは見出しごと隠れる"
    desktop: "spec 34。それまでは DesktopShell が Tauri の時に日本語へ戻す (外枠の言葉が日本語だけなので、エディタだけ英語になって混ざらないように。spec 31 P1)"
  switch: "開き直さずに全部の言葉が変わる (表と state はキーを持ち、描く時に訳す, D6)"

UiMessages:
  description: >-
    画面の言葉の訳 (spec 31 D2・D6・D7)。i18next の 1 つの instance (components/i18n/i18n.ts の i18n。資源は同梱し同期で初期化、useSuspense: false)
  files: "locales/<lng>/common.json (名前空間 common)。デスクトップの訳はここに入れない (spec 34 で lib/desktop/locales/ を addResourceBundle で足す)"
  keys: "場所ごとの入れ子 (flowPanel.addNode・confirmDelete.title など)。数は count で、英語は _one・_other を持つ"
  title: "タブの題は組み立ての時は metadata の日本語。言語が決まったら DocumentTitle が document.title を書く (NEXT_PUBLIC_SITE_TITLE で差し替えた組み立てでは触らない)"
  aria: "xyflow の部品の言葉は components/layout/use-flow-aria-labels.ts を 2 つの <ReactFlow> の ariaLabelConfig に。CodeMirror の文言は editor-phrases.ts (ライブラリのキー → 訳のキー) を Compartment で差し替える"
  use:
    component: "useTranslation は @/components/i18n から読む (instance に結んだ包み。Provider の無い描画・テストでも同じ instance を使う)"
    function: "部品の外 (純粋な関数) は呼ばれた時に i18n.t で訳して返す。読み込み時 (モジュールの表) に t を呼ばない"
  not_translated: >-
    Mermaid の記法 (キーワード・例の構造・PK/FK/UK)・図の中身に入る既定値 (新しいノードの Node {id}・線の relation・枠の変数名 group{n})・
    mermaid.js と merman の構文エラーの文・yamada-ui の組み込みの aria・LOCALES の言語の名・組み立ての時の NEXT_PUBLIC_SITE_TITLE。
    行に「i18n-allow」のコメントを付けた所
  tests: >-
    全部の言語が日本語と同じキーの組を持つ (複数形の接尾辞を外して比べる)。直書き: TypeScript のコンパイラ API で文字列・テンプレート・JSX の文字に
    かな・CJK の漢字が無い (例外は i18n-allow)。英語の直書き: eslint-plugin-i18next の no-literal-string (mode jsx-only、属性 aria-label・title・placeholder・label・alt)。
    既存の vitest は日本語で走らせる (__tests__/setup.ts)

UiColorTokens:
  description: >-
    直に書いていた色を置き換える yamada-ui の semantic token (spec 27 D4)。[ライト, dark] の 2 つの値を持ち、**ライトの値は置き換える前の値そのもの**
    (ライトの値ごとに 1 つの名)。フォーク元の改善 (キーに Lorelei の名を入れない)。dark の値は P1 で画面とコントラストを見て決める (ここは始まりの案)
  file: "components/providers/theme.ts の theme (extendTheme)。UIProvider に渡す"
  css_variables: "yamada-ui が --ui-colors-<名> を出す。CSS Modules (線のラベル) はこれで読む"
  tokens:   # 名: [ライト, dark]
    surface: [white, gray.900]                 # 面 (パネル・ノード・入力欄・メニュー・ツールバー)
    surfaceSubtle: [gray.50, gray.800]         # 一段沈んだ面 (タイトルバー・図の一覧)、面の上でマウスを乗せた時
    surfaceSubtleHover: [gray.100, gray.700]   # 沈んだ面の上でマウスを乗せた時 (図の一覧)
    surfaceSubtleActive: [gray.200, gray.600]  # 同、強め (タイトルバーのボタン)
    line: [gray.200, gray.700]                 # 線・仕切り
    lineStrong: [gray.300, gray.600]           # 入力欄・ボタンの枠線
    text: [black, white]
    textAlpha: [blackAlpha.800, whiteAlpha.800]
    textSubtle: [gray.700, gray.200]
    textHint: [gray.600, gray.300]             # 説明・案内
    textCaption: [gray.500, gray.400]          # 小さい補足・アイコン
    selected: [blue.50, blue.900]              # 選んでいる項目の面 (primary.50 と同じ値)
    selectedStrong: [blue.100, blue.800]       # 開いている図 (図の一覧)
    accent: [blue.500, blue.400]               # 未確定の ●
    accentText: [blue.600, blue.300]           # 選んでいる項目の文字・矢印の記号
    warningText: [orange.600, orange.300]
    warningTextStrong: [orange.700, orange.300]
    dangerText: [red.600, red.300]
    dangerLine: [red.300, red.700]
    dangerSurface: [red.50, red.900]
    nodeBorder: ["#1a365d", blue.200]
    frameSurface: ["rgba(255, 255, 222, 0.45)", "rgba(253, 226, 144, 0.06)"]   # 0.1 では枠の ID (textCaption) が 4.16 (P1)
    edgeStroke: ["#b1b1b7", gray.500]          # xyflow の線 (--xy-edge-stroke)。ライトは xyflow の既定の値
    selectionRing: [blue.500, blue.400]        # 選んだノード・テーブル・枠の輪 (spec 28)。新しい名なので「前の値」は無い。地に対して ライト 3.38・dark 6.70

CanvasSelection:
  description: >-
    キャンバスでノード・テーブル・枠を選ぶ操作と、選んだ印 (spec 28)。操作は xyflow の既定のまま、印はフォーク元の改善
  keys: "クリックで 1 つ選び直す、Ctrl (Mac は ⌘) + クリックで選びに足す・外す (xyflow の multiSelectionKeyCode の既定)、何も無い所から Shift+ドラッグで囲んで選ぶ (selectionKeyCode)。Shift+クリックで足すことはしない (spec 28 裁定)"
  move: "選んだものの 1 つをドラッグすると全部が動く (xyflow)。枠へのドロップ・やめた時に戻すのは動かした全部 (flow-editor の onNodeDragStart / onNodeDragStop)"
  mark: "選んだノード (editable-node)・テーブル (er-table-content)・枠 (subgraph-node) の外枠の要素に outline 3px solid、色の名 selectionRing、outline-offset 2px。選んでいない時は何も足さない (見た目は前と同じ)。共通の形は components/layout/selection-ring.ts"

NodeShapeBadge:
  description: >-
    フローチャートのノードの右上の、形のアイコンの札 (spec 29)。ノードは形にかかわらず四角で描くので、Mermaid のどの形になるかをこれで見せる。フォーク元の改善 (Web 版とデスクトップで同じ)
  shapes: "MermaidShapeType の 6 つ (rectangle / diamond / rounded / circle / hexagon / stadium)。絵は 6 つとも自前の SVG (16px、線は currentColor、aria-hidden)。lucide の組では角丸と四角形・左右が尖る六角形を表せない"
  position: "ノードの外枠の要素の最後の子。position absolute、bottom calc(100% + 2px)・right -2px (外枠の内側から測るので縁の 2px を足し、下端と右端をノードの外側の縁にそろえる)。26×19px (spec 29 P1 で測った)。⋮⋮ のメニュー (ノードの内側の右上 24px 四方) と重ならない。xyflow の測った大きさに入らない"
  press: >-
    札は素のボタン (aria-label・title に形の名)。押すと形のメニュー (6 つの項目、⋮⋮ の「ノード形状」と同じ部品 ShapeMenuItems) を開く。
    メニューは押した時だけ差し込み (components/ui/use-deferred-menu.ts、spec 23 の矢印の切り替えと同じ仕組み)、リストは Portal で文書の直下に出す (failures #28)。
    札は nodrag (押してもノードのドラッグを始めない) で、ダブルクリックを外枠へ伝えない (ラベルの編集を始めない)
  colors: "地は surface、線と縁は nodeBorder (spec 27 の色の名)。青 (selectionRing・左の札) は使わない。選んだ輪 (CanvasSelection.mark) は札の所で札に覆われる (左の札と同じ)"
  routing: "線を回す処理 (spec 17〜22) は札を避けない (左の札と同じ)。回した線・線のボタンが札に重なることは許す"
  variable_badge: "左上の変数名の札 (括弧で形を書く、今のまま) は幅に上限を持ち、はみ出す名は省略する (全文は title)。右上の札にぶつからない"

EditorHistory:
  description: >-
    2 つのエディタ (フローチャート・ER 図) の操作の Undo / Redo (spec 30)。フォーク元の改善 (components/editor-history/、Web 版とデスクトップで同じ)。画面の中だけで持ち、ファイルには書かない
  step: >-
    中身の鍵 (contentKey) が変わった時に 1 手。鍵 = ノードの id・type・parentId・position・width・height・data、線の id・source・target・sourceHandle・targetHandle・type・data、図の向き、テーマ
    (data の関数は JSON に入らないので外れる。selected・dragging・resizing・measured は入れない)。同じフレームの中の変更は 1 手にまとめる。
    ドラッグ・大きさの変更の途中とダイアログが開いている間は保留し、次の変更か Undo の時にまとめて 1 手
  snapshot: "nodes・edges の配列の参照、図の向き、テーマ、次のノードの番号 (鍵には入れない)"
  limit: 100
  restore: "ノードは selected・dragging・resizing を落とし、measured は今の同じ id の値を当てる。線は selected を落とす。次のノードの番号は max(今の値, 戻したノードの数字の ID の最大 + 1)"
  keys: "Ctrl+Z で戻す、Ctrl+Y・Ctrl+Shift+Z でやり直す (Mac は ⌘Z・⌘⇧Z。⌘Y は使わない)。文字の入力の中 (input の文字の種類・textarea・contenteditable) と IME の変換中・ダイアログが開いている間・ドラッグの途中は何もしない"
  buttons: "Web 版はフォーク元のパネル、デスクトップはツールバー (DesktopActions.undo / redo)。戻せる手が無い時は押せない"
  redo_cleared: "新しい手を打つとやり直せる手は消える"

HistoryGate:
  description: >-
    履歴の起点と止め方をエディタへ渡す口 (spec 30 D6、components/editor-history/gate.ts の HistoryGateContext)。フォーク元は lib/desktop を参照しない。
    Web 版は既定の { ready: true, epoch: 0 }
  fields:
    ready: "false の間は記録も戻しもしない。true になった時、その時の state を起点にして履歴を捨てる (デスクトップ: 図の準備ができるまで false)"
    epoch: "変わった時、その時の state を起点にして履歴を捨てる (デスクトップ: 図を隠すたびに進む番号 hideSeq = 開く・別の図に替わる・載せ替える)"
  desktop: >-
    lib/desktop/desktop-shell.tsx が HistoryGateContext.Provider でエディタを包む (spec 30 P2)。ready = DocSession.historyReady
    (位置を当て終えて自動保存を始めた回に true。位置を当てる回・時間切れで見せただけの間は false)、epoch = DocSession.historyEpoch (hideSeq)

RenderConfigOverrides:
  description: 入力の %%{init}%% より優先して Lorelei が固定する設定
  htmlLabels: false            # 最上位と flowchart.htmlLabels。true だと resvg-safe の代替テキストが折り返しを失う (P0-2)
  secure: >-
    crates/lorelei_core/src/engine.rs の 2 つの守り (spec 24 D4-2、P2)。図の frontmatter・init はこれを上書きできない (theme はどちらにも入っていないので図の中が勝つ)。
    書き出し (render・validate) = EXPORT_SECURE_KEYS = merman の HARDENED_SECURE_KEYS から themeVariables を外したもの (secure・securityLevel・startOnLoad・maxTextSize・suppressErrorRendering・maxEdges・fontFamily・altFontFamily・themeCSS) + htmlLabels。
    図に書いた themeVariables の色は書き出しに効く (プレビューの mermaid.js と同じ。themeVariables.fontFamily は外しても効かない, spec 24 P0 結果の 5)。色として読めない値は merman が解析で ThemeColor のエラーにし、validate も ok=false (「図の設定 (themeVariables) の色を読めません (…)」、行は無し) になる。
    取り込み (to_editor) = IMPORT_SECURE_KEYS = 書き出しの守り + themeVariables (spec 24 より前と同じ)。取り込みは themeVariables を落とすので、その色の値で取り込みを落とさない。validate の失敗の時に図の種類を読むのもこちら

FontBundle:
  description: PNG / PDF 変換で使うフォント。OS のフォントに依存しない
  fonts: [NotoSansJP-Regular, NotoSansJP-Bold]   # OFL-1.1。静的フォント (可変は fontdb が Thin で読む, P0-3)。About と THIRD_PARTY_LICENSES に表示
  source: "Noto Sans JP 可変フォント v2.004 から scripts/build-fonts.py で wght=400 / 700 を切り出す (同じ入力から同じバイト列)"
  reserved_font_name: "Source (Adobe)。改変版の名前に使えない — 切り出し後のファミリー名は Noto Sans JP で該当しない"
  sharing: "OnceLock<Arc<fontdb::Database>> (プロセスで 1 つ)"
  system_fonts: false   # システムフォントは読まない (端末ごとに出力が変わるのを防ぐ)

McpServer:
  transport: streamable_http   # spec 03 で stdio から移した (stdio の lorelei --mcp・単体 bin lorelei-mcp は P3 で撤去)。GUI のプロセスの中で待ち受ける (GUI を閉じていると使えない)
  http:
    bind: "127.0.0.1:{port}"      # 固定。0.0.0.0 にしない (LAN へ出さない)
    path: /mcp
    default_port: 39642           # Fuseforks (39641) と並べて使えるように
    auth: "Authorization: Bearer <McpServerConfig.token>。定数時間で比べる。無い・違う → 401 (理由を分けない)"
    host_check: "rmcp の既定 allowed_hosts (loopback 3 種)。DNS rebinding 対策"
    origin_check: "http://127.0.0.1:{port} と http://localhost:{port} だけ。Origin ヘッダの無い要求 (CLI のクライアント) は通す"
    editor_port: >-
      GUI の図の一覧への口 (lorelei_mcp::EditorPort)。lorelei_mcp は Tauri に依存しない。4 つ (spec 04 D3、spec 08 D4):
      open(source, title?) → Ok({ id, updated_at }) | Err(理由) / list() → DiagramSummary[] / read(id?) → Diagram (original_source は常に詰める。include_original で省くのはツールの層) /
      update(UpdateRequest) → Ok(UpdateOutcome) | Err(UpdateError)。UpdateRequest = { id, source, editor (flowchart | erDiagram。lorelei_mcp が変換で決めた種類), expected_updated_at, open (既定 false) }、
      UpdateOutcome = { open: bool (載せ替え・開くを GUI へ渡した), updated_at (書いた後の値) }、
      UpdateError = KindMismatch { actual } (→ updated: false + reason) | NotFound | Conflict { current_updated_at } | Other(String) (→ ツール結果のエラー)
  tool_errors: >-
    入力や規則の問題 (文法エラー・書き出し規則違反・png/pdf で output_path なし) は、プロトコルのエラーではなく
    ツール結果のエラー (isError: true, structuredContent: { error, line? }) で返す。呼ぶ側の AI が読んで直せるように
  refusal_vs_error: >-
    open_in_editor / update_diagram の断り方は 2 分類 (spec 08 D4): 届いた図そのものの問題 (GUI で開けない種類・ノードが 0・update では図の種類が Document.editor と違う) は
    opened / updated: false + reason (AI は図を直すか別のツールを使う)。指した図の状態の問題 (無い id・ごみ箱・expected_updated_at が違う・書けない) はツール結果のエラー { error }。
    文法エラー・空文字は to_editor の Err で、validate と同じツール結果のエラー { error, line? }
  result_shape: "成功時は structuredContent に JSON (validate は ValidationResult、render は RenderResult、open_in_editor / list_diagrams / read_diagram / update_diagram は下の output)。render は preview (既定 true) の時 content に image/png を足す"
  tools:
    validate:
      input: { source: string }
      output: ValidationResult
    render:
      input:
        source: string
        format: RenderFormat
        output_path: { type: string, nullable: true }   # png / pdf では必須
        overwrite: { type: bool, default: false }
        options: { type: RenderOptions, nullable: true }
        preview: { type: bool, default: true }           # PNG を MCP image content でも返す (AI が目で検める用)。長辺 1568px 以内へ縮小。既定 true は利用者 FB 2026-09-24 (spec 01 D2)
      output: RenderResult
    open_in_editor:
      input:
        source: string
        title: { type: string, nullable: true }   # GUI の図の一覧での名前 (spec 02 D8)。省略・空白だけなら「AI の図 HH:MM:SS」。届いた図は新しい 1 件になり、開いている図は上書きしない
      refuses: "ノードが 0 の図 (flowchart TD だけ等。to_editor は通る) は opened: false + reason「ノードの無い図は開けません」— エディタの取り込みが何もせず、前のキャンバスがその図として保存される穴 (spec 08 現況 4・D1)"
      output:
        opened: bool
        editor: { enum: [flowchart, erDiagram], nullable: true }
        dropped: "EditorCompat.dropped"
        reason: { type: string, nullable: true }   # opened=false の理由
        document_id: { type: string, format: uuid, nullable: true }   # 作った図の id (= Document.id = read_diagram の id)。opened=false なら null (spec 04 D2)
        updated_at: { type: string, format: "RFC 3339", nullable: true }   # 作った図の updated_at。そのまま update_diagram の expected_updated_at に渡せる (揃え書きは first_fill で進めない)。opened=false なら null (spec 08 D2)
    list_diagrams:   # spec 04 D2。GUI の図の一覧を読む (Rust のファイルを読む。画面には問い合わせない, D1)
      input: {}
      output:
        diagrams: DiagramSummary[]   # 並びは GUI の一覧と同じ (saved_at ?? created_at の新しい順)
    read_diagram:    # spec 04 D2。人が GUI で直した今の図を読む。GUI での編集は約 1 秒後にファイルへ書かれる (直後の編集は含まれないことがある)
      input:
        id: { type: string, format: uuid, nullable: true }   # 省くと今 GUI で開いている図 (DocumentState.last_opened)
        include_original: { type: bool, default: false }
      output: Diagram
      errors:   # ツール結果のエラー { error }。ファイルのパスは載せない
        not_found: "id が uuid の形でない・その図が無い・ごみ箱に移した → 「図が見つかりません（id: …）」"
        no_open: "id を省いたのに last_opened が無い・指している図が無い → 「今開いている図がありません。id を指定するか、GUI で図を開いてください」"
    update_diagram:  # spec 08 D1〜D3。既存の 1 件の中身を、届いた Mermaid で丸ごと差し替える (差分の適用はしない。AI は read_diagram で読んだ Mermaid を直して丸ごと送る)
      input:
        id: { type: string, format: uuid }                    # list_diagrams の id / open_in_editor の document_id
        source: string                                        # flowchart か erDiagram。Document.editor と同じ種類でなければならない
        expected_updated_at: { type: string, format: "RFC 3339" }   # 必須 (利用者裁定 2026-09-28)。read_diagram / list_diagrams / open_in_editor / 前の update_diagram が返した updated_at をそのまま渡す。時刻として同じ瞬間か比べる (表記の違いは吸収、丸めた値は別の瞬間 = Conflict)
        open: { type: bool, default: false }                  # true なら GUI でその図を開いて窓を前に出す (開いている図でも前に出す)。false なら画面を変えない (開いている図は載せ替える)。既定 false は利用者裁定 2026-09-28
      writes: "Document.update を見よ (source / original_source / updated_at / normalize_pending。title / editor / origin / created_at / saved_at / layout は変えない。書く前に Document.history へ 1 世代)"
      refuses:   # updated: false + reason。ファイルは変えない
        kind_mismatch: "届いた図の種類が Document.editor と違う → 「この図は flowchart です。erDiagram にするなら open_in_editor で新しい図を作ってください」"
        not_editable: "GUI で開けない種類 → open_in_editor と同じ文言"
        no_nodes: "ノードが 0 → 「ノードの無い図は開けません」"
      errors:    # ツール結果のエラー { error }。ファイルのパスは載せない
        not_found: "read_diagram と同じ「図が見つかりません（id: …）」"
        conflict: "expected_updated_at がファイルの updated_at と違う → 「図が変わっています（updated_at: 今の値）。read_diagram で読み直してから update_diagram してください」。解釈できない値は入力のエラー"
        other: "書けない等。Store のエラー文字列をそのまま"
      output:
        updated: bool
        editor: { enum: [flowchart, erDiagram], nullable: true }
        dropped: "EditorCompat.dropped"
        reason: { type: string, nullable: true }               # updated=false の理由
        open: bool                                             # 載せ替え・開くを GUI へ渡した (Rust が積んだ時点の判断。フロントが捨てた場合は分からない)。updated=false なら false
        updated_at: { type: string, format: "RFC 3339", nullable: true }   # 書いた後の値。次の update_diagram の expected_updated_at にそのまま使える (揃え書きは進めない)。updated=false なら null
      gui_effect: >-
        Rust (deliver_update) が last_opened と open で決める (判断は純粋な関数): last_opened と一致 → Reload (OpenRequest { reload: true, layout, document } で載せ替え。open=true なら前に出す) /
        一致せず open=true → Open (reload: false、layout 付きで開き、前に出す) / 一致せず open=false → FileOnly。書けた時はどの場合も GuiCommands.documents_event を出す (updated=false なら出さない)。
        last_opened は図を開いている全区間で前の図を指す (spec 08 現況 3) ので、その間は FileOnly に倒れ、古いキャンバスの保存は Document.save_stale が受け持つ
      blind_spot: "GUI で編集中の、まだファイルに書かれていない直近約 1 秒の変更 (自動保存の待ち) と、update の後 1 秒以内の編集 (揃え書きに混ざり updated_at を進めない) は止められない。Document.history で拾う (spec 08 D2)"

DiagramSummary:   # MCP の出力の形 (snake_case)。GUI の Document / DocumentSummary から詰める (spec 04 D2・D3)
  fields:
    id: { type: string, format: uuid }
    title: string
    editor: { enum: [flowchart, erDiagram] }
    origin: { enum: [new, ai, import] }
    created_at: { type: string, format: "RFC 3339" }
    updated_at: { type: string, format: "RFC 3339" }
    saved_at: { type: string, format: "RFC 3339", nullable: true }
    unsaved: "bool。最後に「確定」(Ctrl+S) した中身と今の中身が違うか (DocumentSummary.unsaved と同じ。spec 32 D2: 確定した中身があればその比べ、無い古い図は確定の後に変わったかの時刻の比較。ファイルの中身で、画面上の書き込み前の編集ではない)"
    open: "bool。今 GUI で開いている図 (DocumentState.last_opened と一致)。一致する図が無ければ全件 false"

Diagram:
  fields: "DiagramSummary の全項目 + source + original_source"
  source: >-
    string。今の図の Mermaid (エディタの生成器の出力。style などは落ちている。向きと FK は spec 07、flowchart の subgraph は spec 15 で残るようにした)。
    空文字は「new の図: まだ一度も保存されていない」「ai / import の図: まだエディタに載っていない」(エラーにしない。注記の欄は設けない)。
    update_diagram の後、GUI で開く (載せ替える) までは届けた Mermaid そのもの (省かれる要素も残ったまま。spec 08 D1)
  original_source: "include_original=false ならキーごと出さない。true なら AI・インポートが最後に届けた原文 (update_diagram で置き換わる)。new の図は update_diagram されるまで null (spec 08 D1)"

GuiCommands:
  description: GUI (Tauri) の custom command とイベント。フロント側は lib/desktop/ だけがこれを呼ぶ
  take_pending_open: "溜まっている OpenRequest の配列を返して空にする。フロントは準備でき次第と OPEN_EVENT のたびに呼ぶ。ただし外枠 (DocsBridge) が立つまでは呼ばない — 最初の描画 (Web 版と同じ木) のエディタが取り込むと、外枠付きのエディタに作り直された時に中身が捨てられる (failures #13, spec 08 P3)"
  open_event: "lorelei://open-pending (本体を持たない合図)"
  open_request: >-
    { source, payload: EditorPayload | null, dropped, error: DesktopError | null, document: DocumentSummary | null, reload: bool, layout: Layout | null }。
    error は spec 34 D3 で string から DesktopError に (MCP の reason には Rust の Display の文を渡す。前と同じ文)。
    document は AI / インポートで届いた図のために作った新しい 1 件 (spec 02 D8・D10)、update_diagram では書き換え後のその 1 件。変換に失敗した時は作らず null。
    reload (既定 false) と layout は spec 08 D3: update_diagram が開いている図を載せ替える要求は reload: true で、layout はその図の Document.layout (同じ ID のノードの位置を当てる)。
    convert_source の戻り (保存した図を開く時) は reload: false・layout: null (フロントは doc.layout を使う)。
    フロント (drain) は reload の要求を partitionOpens に入れず別に扱う: 今のページの種類と今の図の id が一致すれば載せ替え (beforeImport は今のと同じで、違いは flush せず cancel・layoutRef を要求の layout に・openingRef を消す・base を document.updated_at に。通知「AI が図を書き換えました」)、
    今の図が無ければ (起動直後) 開くとして扱い、それ以外は捨てる。同じ回に別の図の「開く」が並んでも載せ替えを先に処理する。stash には積まない
  import_source: "(source, title?) → ()。ツールバーのインポート。Document (origin: import) を作り、OpenRequest を溜めて OPEN_EVENT を出す。title はフロントが画面の言語で付けた既定の題 (spec 34 D5)"
  convert_source: "(source) → OpenRequest (document は null)。保存した図を開く時の変換。溜めない・イベントも出さない"
  list_documents: "() → DocumentSummary[] (saved_at 、無ければ created_at の新しい順。見る・自動保存・改名では動かない, spec 02 D12)"
  create_document: "(editor, title?) → Document。origin: new、source は空 (エディタの初期図で始まり、最初の自動保存で埋まる)"
  load_document: "(id) → Document"
  save_document: "(id, source, layout, base_updated_at, normalize) → DocumentSummary。自動保存 (D7)。normalize は揃え書きの印 (spec 33、Document.save_normalize)。title / editor / origin / original_source / saved_at は書き換えさせない。中身が同じなら書かない (normalize_pending を消す時は除く)。source が空だった図の最初の書き込みは updated_at を進めない。base_updated_at は Document.save_stale (spec 08 D2)"
  confirm_document: >-
    (id, source, layout, base_updated_at) → DocumentSummary。利用者の「確定」(Ctrl+S, D12。spec 32 D1 で mark_document_saved を置き換えた)。
    1 つの鍵の中で、save_document と同じ規則 (印の無い保存 = 人の操作) で中身を書き、saved_at を今にし、Document.confirmed に書いた中身を残す = 一覧の先頭へ動き、unsaved が消える。
    STALE_BASE・INITIAL_FIGURE_REJECTED・DOCUMENT_GONE は save_document と同じく拒み、何も書かない。空の source は確定しない。
    フロントは自動保存の列に並べ (Autosaver.enqueue、走っている保存と待っている変更を書き終えてから)、図の準備ができている時だけ送る (開いている途中・開けない図・ダイアログの間はボタンも Ctrl+S も効かない)
  rename_document: "(id, title) → ()。並びも unsaved も動かさない"
  trash_document: "(id) → ()。documents/ から trash/ へ移す。物理削除しない。history/{id}.json は動かさない (Document.history)"
  documents_event: "lorelei://documents-changed (本体は DocumentSummary)。update_diagram がファイルを書けた時に出す (spec 08 D3)。外枠はその 1 件だけを一覧で差し替える (setList(map)。一覧を丸ごと読み直さない — 読み直しは自動保存の 1 件差し替えと競合して ● が戻ることがある)"
  last_opened: "() → id | null。起動時に開く図 (DocumentState.last_opened)"
  set_last_opened: "(id) → ()"
  set_ui_locale: >-
    ({ aiTitle: string }) → ()。spec 34 D5。AI が題を付けずに届けた図の題のひな形 (素の {time} を含む。i18next の補間はかけない。時刻は Rust が %H:%M:%S で入れる)。
    フロントは最初に言語を当てた時と切り替えた時に送る。Rust は DocumentState.ai_title_template に覚える (起動してから画面が知らせるまでの間に届く図のため)
  errors: "コマンドの Err は DesktopError (spec 34 D3)。Tauri の境界だけで直列化する。MCP には Display の文 (前と同じ)"
  export_diagram: >-
    (source, format: svg|png|pdf|mmd, fileStem) → 保存したパス | null (取り消し)。フロントの型は lib/desktop/tauri.ts の ExportFormat = "svg" | "png" | "pdf" | "mmd" (spec 25)。
    保存ダイアログは rfd (題「{拡張子の大文字} として保存」・既定の名前 {fileStem}.{拡張子}・種類の絞り込み)。上書きの確認は OS のダイアログが行う (OutputPathPolicy.gui_only)。
    src-tauri/src/desktop.rs の parse_kind が ExportKind { Render(RenderFormat), Mmd } にし (知らない形式は「未対応の形式です」)、Render は export_to (描いて write_output。RenderOptions は既定のまま: テーマと背景は source の先頭のテーマで決まる, spec 24 P2)、
    Mmd は save_mmd (描かず検査もせず、source をそのまま UTF-8 (BOM なし) で write_file。描けないコードでも保存できる, spec 25 D2)。RenderFormat (MCP の render の enum) に mmd は足さない
  show_about: "() → ()。About (rfd の MessageDialog) を出す。入口はタイトルバーの「?」(spec 02 D5。ネイティブのメニューは持たない)。フォーク元への謝辞とライセンス一覧を載せ、全文は bundle.resources で licenses/ に同梱"
  window: "自作タイトルバーのウィンドウ操作は @tauri-apps/api/window (minimize / toggleMaximize / close / data-tauri-drag-region)。権限は capabilities/default.json の core:window:*"
  mcp_status: "() → McpStatus。設定画面とタイトルバーの印が読む (spec 03 D4・D6)"
  set_mcp_enabled: "(enabled) → McpStatus。切ると待ち受けを止め、入れると待ち受ける (初めてならトークンを作る)"
  set_mcp_port: "(port) → McpStatus。1024〜65535。待ち受け中なら待ち受け直す"
  regenerate_mcp_token: "() → McpStatus。今のトークンで開いている接続は次の要求から弾かれる。待ち受け中なら待ち受け直す"
  mcp_status_event: "lorelei://mcp-status (本体は McpStatus)。状態が変わるたびに出す"

McpServerConfig:
  description: GUI の中の MCP の待ち受けの設定 (spec 03 D2)
  path: "{app_data_dir}/mcp_server.json"
  writer: rust                    # JS からは読み書きしない
  fields:
    enabled: { type: bool, default: true }        # 利用者裁定 2026-09-25: 既定で ON
    port: { type: int, default: 39642, range: [1024, 65535] }
    token: { type: string, nullable: true }       # 初めて待ち受ける時に 1 回だけ作る (Uuid v4 の 32 桁の 16 進)。毎回作り直すとクライアントの設定が毎回無効になる
  json_keys: camelCase
  on_read_error: "待ち受けず、設定の保存も拒む (既定値で書き戻すと手で直した鍵を消す。Fuseforks failures #70)。エラーにファイルの中身を載せない (トークンが入っている)"

McpStatus:
  fields:
    enabled: bool
    port: int
    token: { type: string, nullable: true }   # 設定画面のコピーと登録コマンドに使う (同じ利用者の画面にだけ出す)
    state: { enum: [listening, stopped, failed, blocked] }   # blocked = mcp_server.json が読めない
    detail: { type: DesktopError, nullable: true }  # failed / blocked の理由 (ポートが使われている等)。spec 34 D3 で string から。画面は描く時に訳す (state にはエラーの値を持つ)

McpClientSetup:
  description: >-
    設定画面の「クライアント側の設定」で写す 2 つの文 (spec 03 D4・spec 26 D1〜D3)。lib/desktop/mcp.ts が McpStatus から作る。
    画面にはトークンを「<トークン>」に伏せた文を出し、コピーは本物のトークンを入れる。トークンが無い時はどちらもコピーできない
  command: >-
    registerCommand。claude mcp add --transport http lorelei http://127.0.0.1:{port}/mcp --header "Authorization: Bearer {token}"。
    Claude Code の local スコープ (~/.claude.json のそのフォルダの欄。リポジトリに入らない)
  json: >-
    clientConfigJson。{"mcpServers": {"lorelei": {"type": "http", "url": "http://127.0.0.1:{port}/mcp", "headers": {"Authorization": "Bearer {token}"}}}} を 2 字下げで。
    Fuseforks の設定画面と Claude Code の .mcp.json と同じ形。.mcp.json は Git に入れて共有する前提のファイルなので、画面に注意書きを出す (spec 26 D2)
  tabs: "コマンド (Claude Code) / JSON。最初はコマンド。どちらを開いたかは覚えない (spec 26 D3)"

Document:
  description: 図の一覧の 1 件 = 1 枚の図 (spec 02 D6)。デスクトップ版だけのもの
  path: "{app_data_dir}/documents/{id}.json"   # 1 件 1 ファイル。一覧は documents/ 直下の *.json だけを読む (再帰しない)
  writer: rust                                # JS からは読み書きしない (plugin-fs を入れない)。書き込みは一時ファイル → rename
  fields:
    id: { type: string, format: uuid }        # uuid の形だけ受け付ける (パスを外へ出さない)
    title: string                             # 同名は許す (区別は id)
    editor: { enum: [flowchart, erDiagram] }
    source: string                            # 今の図の Mermaid (フォーク元の生成器の出力)。origin: new の作成直後は空。update_diagram の後は GUI に載るまで届けた Mermaid そのもの (spec 08 D1)
    layout: { type: "map<string, { x: float, y: float, width?: float, height?: float }>" }  # キー = Mermaid 上のノード ID (flowchart は getSafeVariableName した変数名、ER はエンティティ名。flowchart の枠は枠の ID)。無いノードは自動配置 (段組みは spec 18: Mermaid と同じ順で輪をほどき、戻る線を除く線が全部下へ向くように上からの最長路で段を振る。features/flowchart/utils/nested-layout.ts の levelsOf と mermaidStartOrder)。位置は絶対座標 (spec 15 D4: 枠の中のノードの xyflow の position は親からの相対なので、保存は根まで足し、当てる時は親から順に相対へ直す。位置の無いノードは今の絶対位置のまま)。width / height は枠だけ (無ければ書かない。古いファイルはそのまま読める)
    origin: { enum: [new, ai, import] }       # 来歴。update_diagram でも変えない (spec 08 裁定 4)
    original_source: { type: string, nullable: true }  # AI・インポートが最後に届けた原文 (update_diagram で置き換わる, spec 08 D1)。new は update_diagram されるまで null
    created_at: { type: string, format: "RFC 3339" }
    updated_at: { type: string, format: "RFC 3339" }   # 中身が最後に変わった時刻。人の編集の自動保存と update_diagram で進む。first_fill と揃え書き (normalize_pending が立っていて、保存に normalize の印がある時) では進まない
    saved_at: { type: string, format: "RFC 3339", nullable: true }   # 利用者が「確定」(旧「保存」) を押した時刻 (D12)。一覧の並びの鍵 (null なら created_at)
    confirmed: { type: "{ source: string, layout: Layout } | null", default: null }  # 最後に「確定」した中身 (spec 32 D1)。確定へ戻す先・● の比べる先。無ければファイルに書かない。前の版で確定した図は、updated_at ≤ saved_at なら読む時に今の中身で埋める。MCP には出さない
    normalize_pending: { type: bool, default: false }  # update_diagram が立てる印 (spec 08 D1)。次の save で消える (source / layout が同じでも印を消すために書く)。updated_at を進めないのは、その save が揃え書きの印 (normalize) を持つ時だけ (spec 33)。古いファイルに無ければ false
  json_keys: camelCase   # ファイルと GUI の受け渡しはどちらも camelCase (originalSource / createdAt / normalizePending ...)
  default_titles:   # spec 34 D5: new と import はフロントが画面の言語で付けて渡す (desktop.defaultTitle.*)。ai は Rust が DocumentState.ai_title_template で付ける
    new: { flowchart: 無題のフローチャート, erDiagram: 無題の ER 図 }   # 日本語の画面の値。英語は Untitled flowchart / Untitled ER diagram
    ai: "AI の図 HH:MM:SS"          # ひな形を一度も知らされていない時 (今の日本語)。MCP の title が来たらそれを使う
    import: "インポート HH:MM:SS"
  trash: "{app_data_dir}/trash/{id}.json"   # 削除は移動だけ。documents/ の外なので一覧に出ない。空にする操作は無い
  initial_sources:   # フォーク元のエディタの初期図を生成器にかけた出力 (一字一句, spec 04 D4-2)。spec 34 D6 で言語ごとの集合に: 保険は全部の言語の初期図のどれかと同じなら拒む
    fixture: "crates/lorelei_core/tests/fixtures/initial_sources.json (vitest が LORELEI_UPDATE_FIXTURES=1 で LOCALES の全部の言語の初期図を書き、Rust のテストが initial_sources(editor) と比べる)"
    flowchart: ["flowchart TD\n    startNode[Start]\n"]   # どの言語でも同じ
    erDiagram: ["erDiagram\n  ユーザー {\n    int id PK\n    varchar(255) name UK\n  }", "erDiagram\n  User {\n    int id PK\n    varchar(255) name UK\n  }"]   # ja / en
  save_guard: >-
    origin が ai / import の図の「空の source への最初の書き込み」(first_fill) が initial_sources と同じなら save_document が拒む。new の図は対象外。拒んだ時のエラーは INITIAL_FIGURE_REJECTED で始まる。
    spec 08 D1 で first_fill の時だけに絞った (旧: 前の source に依らず拒む)。守るのは spec 04 現況 4 の 1 件目の形だけで、update_diagram の後の揃え書き (source は非空) は掛からない —
    AI が初期図と同じ図を update で送っても拒まれ続けない。文字列で初期図を事前に弾く案は採らない (初期図は空白の違いだけで同じペイロードになり、空振りする)
  save_gone: "save_document の相手の図が documents/ に無い (ごみ箱へ移した・消えた) 時のエラーは DOCUMENT_GONE で始まる。フロントはその書き込みを捨てる (書き直しても通らない。残すと「保存できなければ切り替えない」で図を移れなくなる)"
  save_stale: >-
    save_document は base_updated_at (フロントが読んだ版) を添える (spec 08 D2)。ファイルの updated_at と時刻として違えば「STALE_BASE: {今の updated_at}」で拒む (捨ててよい失敗)。
    フロントは、今の updated_at が自分の base_updated_at と同じなら黙って捨てる (載せ替えが先に届いていて画面は新しい)。違えば通知「AI が図を書き換えたので開き直します」を出してその図を開き直す。
    base は load_document・OpenRequest.document・各 save の戻り値の updated_at で更新する。rename / first_fill / 揃え書き / 中身の変わらない確定 (confirm_document) では updated_at が進まないので base は変わらない (確定は戻り値で base を更新する)
  save_normalize: >-
    save_document は normalize_pending をどの保存でも消してファイルに書く (中身が同じでも)。updated_at を進めないのは、保存が揃え書きの印 (normalize: true) を持つ時・中身が同じ時・first_fill の時だけ。
    印の無い保存 (人の編集) は normalize_pending が立っていても中身が違えば updated_at を進める (spec 33: 揃え書きとして通すと AI の古い expected_updated_at が通り、人の編集が知らされずに上書きされる)。
    フロントは図の準備ができてから最初の保存だけを、その時の中身で待たずに印付きで書き (Autosaver.saveNow)、以後は印無し。
    「準備ができた」は位置を当てる指示の後、ノードが実際にその位置になったのを見てから (onNodesChanged の awaitingLayout。指示の直後に当たる前の変化が 1 回届く)。
    Autosaver は保存を 1 つずつ順に送る (走っている保存の戻りを待つ)。first_fill とは重ならない (update は source を非空にする)
  update: >-
    update_diagram の書き込み (spec 08 D1)。documents/ にある図だけ (uuid の形でない・ごみ箱は NotFound)。expected_updated_at をファイルの updated_at と時刻として比べ、違えば Conflict (今の値を載せる)。
    editor が Document.editor と違えば KindMismatch。書くのは source (届いた Mermaid そのまま。生成器を通さない・空にしない) / original_source (同じ文字列) / updated_at (今) / normalize_pending (true)。
    title / editor / origin / created_at / saved_at / layout は変えない (一覧の並びは動かず、● が付く。同じ ID のノードは位置を保つ)。書く前に history へ 1 世代写す。比較と書き込みは store_lock の中
  store_lock: "Store の save / confirm / update / rename / trash の load → write は、プロセスで 1 つの static Mutex の中で行う (Store は呼ぶたび作られる。MCP は spawn_blocking、Tauri の command は別スレッドで順序が無い。TOCTOU を作らない, spec 08 D2)"
  history: "{app_data_dir}/history/{id}.json。update_diagram が書き換える前の Document を 1 世代だけ写す (次の update で上書き, spec 08 D5)。GUI は持たない (戻すのは人が手で)。ごみ箱へ移しても動かさない・消さない (空にする操作は無い)"

DocumentSummary:
  description: 一覧用。source / layout / original_source を持たない
  fields: [id, title, editor, origin, created_at, updated_at, saved_at, unsaved, has_confirmed]
  unsaved: >-
    一覧とタイトルの ● (spec 32 D2)。Document.confirmed があれば「source が完全一致、layout はキーの集合が同じで各値の差 ≤ 1e-6」でなければ true (戻せば消える)。
    無ければ今までどおり updated_at > (saved_at ?? created_at)
  has_confirmed: "Document.confirmed がある。ツールバーの「確定へ戻す」は has_confirmed かつ unsaved かつ図の準備ができている時だけ押せる (spec 32 D3)"

DocumentState:
  path: "{app_data_dir}/state.json"
  fields:
    ai_title_template: { type: string, nullable: true }   # spec 34 D5。set_ui_locale で覚える AI の図の題のひな形 ({time} を含む)。無ければ今の日本語「AI の図 {time}」
    last_opened: { type: string, format: uuid, nullable: true }   # 起動時に開く図。無い・消えている時は一覧の先頭 (最後に「確定」した図, spec 02 D12)、1 件も無ければフローチャートを 1 件作る (D9)

DesktopError:
  description: >-
    Rust が画面に渡すエラー (spec 34 D3)。Tauri の境界 (コマンドの Err・OpenRequest.error・McpStatus.detail) だけでこの形に直列化する。
    Display は今の日本語の文のまま (MCP の reason・readback・ログはこれ。AI 向けは訳さない)
  fields:
    code: string                                  # 見分ける名 (下の codes)。フロントは describeError で code を訳し、isStaleBase などは code で見分ける
    params: { type: "map<string, string | number>", nullable: true }   # 訳と見分けに使う値 (STALE_BASE の currentUpdatedAt・ポートなど)
    detail: { type: string, nullable: true }      # 訳さない詳しい文 (io・serde・merman・lorelei_core の文。OS の言語や英語が混ざる)
  codes:
    documents: [DOC_LIST_FAILED, DOC_READ_FAILED, DOC_CORRUPT, DOC_WRITE_FAILED, INVALID_ID, TRASH_FAILED, NOTHING_TO_CONFIRM, DOCUMENT_GONE, INITIAL_FIGURE_REJECTED, STALE_BASE]   # 書き換え前の控えの失敗は MCP の update_diagram だけに出るので code を持たない (UpdateError::Other の文)
    app: [NO_DATA_DIR, ADD_FAILED, UNSUPPORTED_DIAGRAM, CONVERT_FAILED]   # CONVERT_FAILED の detail は lorelei_core の文 (訳さない)
    desktop: [UNSUPPORTED_FORMAT, EXPORT_FAILED, TASK_FAILED]           # EXPORT_FAILED の detail は lorelei_core (render・output) の文
    mcp: [MCP_CONFIG_UNREADABLE, MCP_TOKEN_SAVE_FAILED, MCP_LISTEN_FAILED, MCP_PORT_RANGE]
    other: OTHER   # From<String> (code の無い文。detail に入れる)
  params:
    STALE_BASE: { currentUpdatedAt: string }
    INVALID_ID: { id: string }
    UNSUPPORTED_FORMAT: { format: string }
    MCP_CONFIG_UNREADABLE: "{ line?: int, column?: int }"
    MCP_LISTEN_FAILED: { port: int }
    MCP_PORT_RANGE: { min: int, max: int }
  fixture: "src-tauri/tests/fixtures/desktop_error_codes.json (src-tauri/src/error.rs の ALL_CODES。Rust のテストが LORELEI_UPDATE_FIXTURES=1 で書き直し、__tests__/lib/desktop/errors.test.ts が desktop の訳に全部あり、余分な訳が無いことを確かめる)"
  rust: "src-tauri/src/error.rs。documents.rs・lib.rs (store・取り込み・コマンド)・desktop.rs・mcp_host.rs が返す。MCP へ渡す所 (readback・EditorPort・deliver) は to_string() で前の文に"
  frontend: "lib/desktop/errors.ts の describeError(e): object も今の文字列も読む。code の無い文字列は題だけ訳し文はそのまま。state にはエラーの値を持ち、描く時に訳す (spec 34 D3)"

DesktopMessages:
  description: >-
    デスクトップの外枠の画面の言葉 (spec 34 D1)。名前空間 desktop。lib/desktop/locales/<lng>.json を lib/desktop/i18n.ts が addResourceBundle で足す (フォーク元の locales/ には入れない)。
    部品は lib/desktop/i18n.ts の useDesktopTranslation、部品の外は desktopT (呼ばれた時の言語)。キーの型は components/i18n/resources.ts の I18nResources を declare module で広げる
  tests: "日本語と英語のキーの組・差し込みの一致 / lib/desktop の直書き (__tests__/lib/desktop/hardcoded-text.test.ts) / eslint の i18next/no-literal-string を lib/desktop/**/*.tsx にも"
  window_show: "言語は LocaleSync が当てる (外枠より前の兄弟の effect。changeLanguage は同期)。外枠は Tauri の時に日本語に留める処理を spec 34 P1 で外し、show の時に当てた言語になっていることをテストで固定する"

DesktopLayout:
  description: デスクトップの外枠の寸法と開閉 (spec 05 D1〜D3)。表示の都合なので図の一覧やアプリの状態とは分ける
  storage: "WebView の localStorage、キー lorelei.layout.v1 (利用者裁定 2026-09-26)。dev と配布版は起点が違うので別々に覚える"
  writer: js   # lib/desktop/pane-layout.ts だけが読み書きする。Rust は触らない
  fields:
    listWidth: { type: int, unit: px, default: 240, range: [180, 480] }   # さらに窓の幅の半分を超えない (画面の都合で決まるので保存値は 480 までの値のまま)
    listOpen: { type: bool, default: true }                              # タイトルバーの ≡
  on_read_error: "読めない・壊れている → 既定値。範囲外 → 範囲の端。書けなくても操作は続ける"

# EditorInbox ({app_data_dir}/inbox/{uuid}.json と lorelei --open) は spec 03 P3 で撤去した。
# open_in_editor は GUI の中の HTTP の MCP から EditorPort でじかに届く (McpServer.http.editor_port)。
# 既に残っている inbox/ のファイルは誰も読まない (利用者裁定 2026-09-25: 放置でよい)
