name: バグ報告
description: バグや不具合の報告
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: バグの内容を簡潔に記載してください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: バグを再現する手順を記載してください。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
      description: 本来どう動作すべきか記載してください。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際にどうなったか記載してください。
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 環境情報 / Environment
      description: |
        Lorelei の版（タイトルバーの「?」の About）・OS・デスクトップ版か Web 版のデモか・MCP の問題ならクライアント（Claude Code の版など）。MCP のトークンは貼らないでください。
        Lorelei version (About, the "?" in the title bar), OS, desktop app or web demo, and the MCP client for MCP problems. Never paste your MCP token.
    validations:
      required: false
