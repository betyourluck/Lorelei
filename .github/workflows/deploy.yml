name: Deploy to GitHub Pages

# Lorelei (spec 20 裁定 2): 手動だけで走らせる。このフォークは GitHub Pages を使っておらず、main への push のたびに
# docs/ をボットが main へコミットすると、手元の main と origin が分かれる。フォーク元の元の形: push: { branches: [main] }
on:
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and PNPM
        uses: ./.github/actions/install

      - name: Build Next.js static site
        run: |
          pnpm build
        env:
          NODE_ENV: production

      - name: Build Storybook static site
        run: |
          pnpm build-storybook

      - name: Create .nojekyll file
        run: |
          touch docs/.nojekyll

      - name: Push to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          add: "docs"
          default_author: github_actions
          message: "docs: deploy to GitHub Pages"
