# Rust 側の workspace。フロント (Next.js) はリポジトリ直下のまま触らない。
# src-tauri/ は重い tauri 依存を `cargo test --workspace` から隔離するため workspace の外に置く (spec 01)。
[workspace]
resolver = "3"
members = ["crates/lorelei_core", "crates/lorelei_mcp"]
# vendor/ は上流 crate の写し。workspace のテスト・lint の対象にしない
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# alpha 版で API が動くので完全一致で固定する (spec 01 D4)。png / pdf / jpeg feature は入れない (D3)
merman = { version = "=0.8.0-alpha.6", default-features = false, features = ["svg"] }
# 以下 4 つは merman が持ち込む版に揃える (二重に入れない)
usvg = "0.47"
resvg = "0.47"
krilla = "0.8.2"
krilla-svg = "0.8.1"
svgtypes = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
# Fuseforks と同じ 2.2 系。GUI の中の Streamable HTTP の features は lorelei_mcp が足す (spec 03)
rmcp = "2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"

# merman-core 0.8.0-alpha.6 は日本語などのノード ID を拒否する (mermaid.js は受け付ける)。
# 修正版を上流へ PR するまで写しを使う。差分は vendor/merman-core/LORELEI_PATCH.md (spec 01「P1 で判明したこと」)
[patch.crates-io]
merman-core = { path = "vendor/merman-core" }
