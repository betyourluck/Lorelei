[package]
name = "lorelei"
version = "0.1.0"
description = "Lorelei — Mermaid を AI から検査・描画・書き出しし、GUI で手直しするデスクトップアプリ"
edition = "2024"
license = "MIT"
publish = false

# 親 workspace (crates/*) に属さない独立 project。重い tauri 依存を `cargo test --workspace` から隔離する
# (AppPromoVideo / Kataribe と同じ流儀, spec 01)。
[workspace]

[lib]
name = "lorelei_lib"
# デスクトップのみ。モバイル用の staticlib / cdylib は作らない (リンカの余計な出力とビルド時間を省く)
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
lorelei_core = { path = "../crates/lorelei_core" }
lorelei_mcp = { path = "../crates/lorelei_mcp" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 図の一覧 (spec 02 P3)。どちらも既に Cargo.lock に入っている (新しい crate は増えない)
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 保存ダイアログと About は OS ネイティブのダイアログ。plugin-dialog を足さず custom command で完結する
# (JS に権限を足さない。AppPromoVideo と同じ, spec 01 P4)
rfd = "0.17"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# **ルートの [patch.crates-io] はこの独立 project には効かない**。同じ patch を書かないと、GUI だけが
# 修正前の merman-core (日本語のノード ID・ER 図の tokens などの名前を拒否する) を使う (vendor/merman-core/LORELEI_PATCH.md)。
# 効いていることは tests で固定している (japanese_node_ids_are_accepted_in_the_gui_build /
# er_names_starting_with_cardinality_words_are_accepted_in_the_gui_build)
[patch.crates-io]
merman-core = { path = "../vendor/merman-core" }
