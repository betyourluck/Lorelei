[package]
name = "lorelei_mcp"
version = "0.1.0"
description = "Lorelei の MCP サーバー。GUI の中で 127.0.0.1 に待ち受ける Streamable HTTP (spec 03)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lorelei_core = { path = "../lorelei_core" }
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
tokio = { workspace = true, features = ["net", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = "0.7"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
# update_diagram の expected_updated_at を時刻として読めるか確かめる (spec 08 D2)。時計は使わない
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
